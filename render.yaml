services:
  - type: web
    name: trayup-mashad-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi:app db upgrade && gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: trayup-postgres
          property: connectionString
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: trayup-ratelimit
          property: connectionString
      - key: MENU_IMAGE_ALLOWED_HOSTS
        value: images.unsplash.com
      - key: CSP_REPORT_ONLY
        value: "false"
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      - key: FIREBASE_ENABLED
        value: "true"
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_PATH
        value: /etc/secrets/serviceAccountKey.json
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Email for password-recovery codes. Production refuses MAIL_BACKEND=console or memory.
      - key: MAIL_BACKEND
        value: smtp
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_USE_TLS
        value: "true"

  # Shared rate-limit counters. The app refuses to start in production with memory://,
  # so every instance and restart uses the same counters.
  - type: keyvalue
    name: trayup-ratelimit
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru

databases:
  - name: trayup-postgres
    databaseName: trayup
    user: trayup
    plan: free
    region: singapore
